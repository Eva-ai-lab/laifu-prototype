<title>來福校園陪伴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 一支手機畫面(左)配一欄示範資訊(右);窄螢幕時上下堆疊。 */
:root{
  --bg:#E7F0ED; --surface:#FFFFFF; --surface-2:#F1F7F5; --ink:#1F2D2A; --ink-2:#4B5F5A; --line:#D2E0DB;
  --primary:#22756B; --on-primary:#FFFFFF; --primary-soft:#D5EBE6; --on-soft:#12453F;
  --amber-soft:#FCEBC8; --on-amber:#4A3208;
  --orange-soft:#FFE0C7; --on-orange:#6B3410;
  --crit:#B3382F; --crit-soft:#FADDDA; --on-crit:#6E1D17;
  --fur:#E9A94F; --ear:#C47D2F; --muzzle:#FCE5C0; --blaze:#FFF4DE; --nose:#3A2A1E; --blush:#F4A394; --tongue:#EE7C88; --collar:#22756B; --tag:#F6D14C;
  --shadow:0 12px 32px rgba(25,50,45,.14);
  --font-body:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --font-num:'Fredoka','Noto Sans TC',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1816; --surface:#17231F; --surface-2:#1E2D29; --ink:#E7F1EE; --ink-2:#A3B8B2; --line:#2B3C37;
  --primary:#63C7B8; --on-primary:#0B2622; --primary-soft:#1F3B36; --on-soft:#BFEBE3;
  --amber-soft:#3D2F14; --on-amber:#F6D9A0; --orange-soft:#44301C; --on-orange:#F6CFAA;
  --crit:#FF8E84; --crit-soft:#4A2320; --on-crit:#FFCBC6;
  --fur:#D99A45; --ear:#A9692A; --muzzle:#F2D6AC; --blaze:#FFF0D4; --collar:#63C7B8;
  --shadow:0 12px 32px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1816; --surface:#17231F; --surface-2:#1E2D29; --ink:#E7F1EE; --ink-2:#A3B8B2; --line:#2B3C37;
  --primary:#63C7B8; --on-primary:#0B2622; --primary-soft:#1F3B36; --on-soft:#BFEBE3;
  --amber-soft:#3D2F14; --on-amber:#F6D9A0; --orange-soft:#44301C; --on-orange:#F6CFAA;
  --crit:#FF8E84; --crit-soft:#4A2320; --on-crit:#FFCBC6;
  --fur:#D99A45; --ear:#A9692A; --muzzle:#F2D6AC; --blaze:#FFF0D4; --collar:#63C7B8;
  --shadow:0 12px 32px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,h3,h4,p,ul,dl{margin:0}
ul{padding-left:1.1em}
.muted{color:var(--ink-2);font-size:13px}
.wrap{max-width:1040px;margin:0 auto}

/* 上方示範控制 */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand h1{font-size:20px;line-height:1.3}
.brand p{font-size:13px;color:var(--ink-2)}
.tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{min-height:36px;padding:0 14px;border-radius:999px;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);font-weight:700}
.swline{display:flex;align-items:center;gap:8px;font-size:14px}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"] i{transform:translateX(18px)}
.btn{min-height:44px;padding:0 18px;border-radius:14px;background:var(--primary);color:var(--on-primary);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.soft{background:var(--primary-soft);color:var(--on-soft)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.ghost{color:var(--primary);font-weight:500;min-height:36px;padding:0 8px}

/* 舞台 */
.stage{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start;justify-content:center}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}
.phone{position:relative;width:100%;max-width:420px;margin-inline:auto;height:clamp(600px,calc(100dvh - 130px),820px);
  background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.side{display:grid;gap:16px;min-width:0;width:100%;max-width:560px;margin-inline:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel h3{font-size:16px;margin-bottom:10px}
.panel h4{font-size:13px;margin:14px 0 6px;color:var(--ink-2);letter-spacing:.04em}
.panel ul{display:grid;gap:4px;font-size:14px}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0}

/* 手機內部 */
.app-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);flex:none}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .av{width:36px;height:36px;flex:none}
.who b{display:block;font-size:15px;line-height:1.2}
.who span{font-size:12px;color:var(--ink-2)}
.screen{flex:1;overflow-y:auto;padding:16px;min-height:0}
.screen.flush{padding:0;overflow:hidden;display:flex;flex-direction:column}
.screen h2{font-size:20px;margin-bottom:4px}
.stack{display:grid;gap:14px}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h3{font-size:15px;margin-bottom:8px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);flex:none}
.nav button{display:grid;justify-items:center;gap:2px;padding:8px 0 10px;font-size:12px;color:var(--ink-2);min-height:56px}
.nav button[aria-current="page"]{color:var(--primary);font-weight:700}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 來福 */
.dog{display:block;width:100%;height:100%;overflow:visible}
.dog .fur{fill:var(--fur)} .dog .ear{fill:var(--ear)} .dog .muzzle{fill:var(--muzzle)} .dog .blaze{fill:var(--blaze)}
.dog .nose{fill:var(--nose)} .dog .blush{fill:var(--blush);opacity:.7} .dog .tongue{fill:var(--tongue)}
.dog .collar{fill:none;stroke:var(--collar);stroke-width:7;stroke-linecap:round} .dog .dtag{fill:var(--tag)}
.dog .ink{fill:#2B2220} .dog .stroke{fill:none;stroke:#2B2220;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.dog-listen{transform:rotate(-5deg);transform-origin:50% 90%}
.role-hero{display:grid;justify-items:center;gap:6px;text-align:center;padding:10px 0 4px}
.role-hero .big{width:120px;height:124px}
.role-hero h2{font-size:24px}
.role-card{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface-2);min-height:64px}
.role-card:hover{border-color:var(--primary)}
.role-card b{font-size:16px}
.role-card span{font-size:13px;color:var(--ink-2);grid-column:1}
.role-card::after{content:"›";grid-row:1/3;grid-column:2;font-size:24px;color:var(--primary)}
.intro{display:grid;gap:14px;justify-items:center;text-align:center;padding:12px 4px}
.intro .big{width:150px;height:155px}
.intro h2{font-size:22px}
.intro p{max-width:30em;color:var(--ink-2)}
.dots{display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--primary);width:22px;border-radius:99px}

/* 聊天 */
.dogbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--primary-soft);flex:none}
.dogbar .dwrap{width:58px;height:60px;flex:none;animation:bob 3.2s ease-in-out infinite}
.dogbar b{display:block;color:var(--on-soft)}
.dogbar span{font-size:13px;color:var(--on-soft);opacity:.85}
@keyframes bob{50%{transform:translateY(-3px)}}
.msgs{flex:1;overflow-y:auto;padding:14px 14px 6px;display:grid;align-content:start;gap:12px;min-height:0}
.row{display:flex;gap:8px;align-items:flex-end}
.row.user{justify-content:flex-end}
.row .av{width:32px;height:34px;flex:none;align-self:flex-start}
.col{display:grid;gap:8px;min-width:0;max-width:calc(100% - 44px)}
.bub{padding:10px 14px;border-radius:18px;overflow-wrap:anywhere}
.bub.dog{background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub.user{background:var(--primary);color:var(--on-primary);border-bottom-right-radius:6px;max-width:82%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--primary);color:var(--primary);font-size:14px;font-weight:500}
.chip:hover{background:var(--primary-soft)}
.chip.on{background:var(--primary);color:var(--on-primary)}
.xai-btn{justify-self:start;min-height:32px;font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.xai{background:var(--surface);border:1px dashed var(--primary);border-radius:14px;padding:12px;font-size:14px;display:grid;gap:8px}
.xai small{color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;background:var(--surface-2);border:1px solid var(--line)}
.tag.ty{background:var(--primary-soft);color:var(--on-soft);border-color:transparent}
.tag.tn{background:var(--surface-2);color:var(--ink-2)}
.tag.tc{background:var(--amber-soft);color:var(--on-amber);border-color:transparent}
.typing{display:flex;gap:5px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:18px;width:max-content}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-2);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-4px);opacity:.4}}
.try{padding:6px 14px 8px;display:grid;gap:4px;flex:none}
.try>span{font-size:12px;color:var(--ink-2)}
.try .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.try .chip{flex:none;border-style:dashed;white-space:nowrap}
.composer{display:flex;gap:8px;padding:8px 12px 12px;border-top:1px solid var(--line);flex:none}
.composer input{flex:1;min-width:0;min-height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit}
.composer .mic{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.composer .mic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.crisis{background:var(--crit-soft);color:var(--on-crit);border:1.5px solid var(--crit);border-radius:16px;padding:14px;display:grid;gap:10px}
.crisis h3{font-size:17px}
.hot{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px}
.hot b{font-family:var(--font-num);font-size:22px;letter-spacing:.02em}
.hot small{grid-column:1;color:var(--ink-2)}
.hot button{grid-row:1/3;grid-column:2;min-height:36px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);font-size:13px}
.notice{background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px}

/* 日記 */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.moods button{display:grid;justify-items:center;gap:2px;padding:8px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:12px;color:var(--ink-2);min-height:64px}
.moods button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--on-soft);font-weight:700}
.moods svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
textarea{width:100%;min-height:76px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;font:inherit;resize:vertical}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-size:10px;font-family:var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .pt{fill:var(--surface);stroke:var(--primary);stroke-width:2}
.chart .pt.last{fill:var(--primary)}
.entry{display:grid;grid-template-columns:3.2em 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.entry:first-of-type{border-top:0}
.entry time{font-family:var(--font-num);color:var(--ink-2)}
.swrow2{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.swrow2 small{display:block;color:var(--ink-2);font-size:13px}

/* 預約 */
.slot{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);min-height:54px}
.slot[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.slot .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink-2);flex:none}
.slot[aria-pressed="true"] .rd{border-color:var(--primary);background:radial-gradient(var(--primary) 45%,transparent 50%)}
.slot small{display:block;color:var(--ink-2)}
.ok{display:grid;gap:12px;justify-items:center;text-align:center;padding:20px 8px}
.ok .big{width:110px;height:114px}

/* 隱私 */
.mx{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px}
.mx h4{font-size:14px;margin-bottom:6px}
.mxr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;font-size:14px}
.mxr>span:first-child{color:var(--ink-2);flex:none}
.mxr .tag{text-align:right;border-radius:10px}
.log{font-size:14px;display:grid;gap:6px}

/* 老師、家長 */
.pill{display:inline-flex;align-items:center;padding:1px 10px;border-radius:999px;font-family:var(--font-num);font-weight:600;font-size:13px}
.pill.lv0{background:var(--primary-soft);color:var(--on-soft)}
.pill.lv1{background:var(--amber-soft);color:var(--on-amber)}
.pill.lv2{background:var(--orange-soft);color:var(--on-orange)}
.pill.lv3{background:var(--crit-soft);color:var(--on-crit);border:1px solid var(--crit)}
.pill.lvB{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);font-family:var(--font-body)}
.alert{display:grid;gap:4px;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface-2)}
.alert.l3{border-color:var(--crit);background:var(--crit-soft);color:var(--on-crit)}
.alert .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.alert .meta b{font-family:var(--font-num)}
.alert .state{margin-left:auto;font-size:12px}
.spark{width:100%;max-width:240px;height:auto;display:block}
.spark .ln{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:var(--primary)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:110px}
.bars div{display:grid;gap:4px;justify-items:center;align-items:end;height:100%;font-size:12px;color:var(--ink-2)}
.bars i{display:block;width:100%;max-width:26px;border-radius:8px 8px 4px 4px;background:var(--primary)}
.bars i.zero{background:var(--line)}

/* 覆蓋層 */
.sheet-wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
.scrim{position:absolute;inset:0;background:rgba(8,20,17,.5);cursor:default}
.sheet{position:relative;background:var(--surface);border-radius:22px 22px 0 0;padding:16px 16px 20px;max-height:88%;overflow-y:auto;display:grid;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head b{font-size:17px}
.breath{display:grid;justify-items:center;gap:12px;text-align:center;padding:6px 0}
.bcircle{width:150px;height:150px;border-radius:50%;background:var(--primary-soft);border:2px solid var(--primary);padding:30px 34px 24px;transition-property:transform;transition-timing-function:ease-in-out}
.btext{font-size:20px;font-weight:700;min-height:1.6em}
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:12px;font-size:14px;text-align:center;z-index:9}

@media (prefers-reduced-motion:reduce){
  .dogbar .dwrap,.typing i,.sheet{animation:none}
  .bcircle,.switch,.switch i{transition:none}
}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>來福校園陪伴</h1>
      <p>校園動物輔導與共情陪伴智慧代理人 · 可點擊原型</p>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="切換身分">
        <button data-act="role-jump" data-role="student" aria-pressed="false">學生</button>
        <button data-act="role-jump" data-role="teacher" aria-pressed="false">輔導老師</button>
        <button data-act="role-jump" data-role="parent" aria-pressed="false">家長</button>
      </div>
      <div class="swline"><span>輔導老師在線</span>
        <button class="switch" role="switch" aria-checked="true" aria-label="輔導老師在線" data-act="toggle" data-k="teacherOnline"><i></i></button></div>
      <button class="btn line small" data-act="reset">重設原型</button>
    </div>
  </div>
  <div class="stage">
    <div class="phone" id="phone"></div>
    <div class="side" id="info"></div>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return n<10?'0'+n:''+n};
var nowT=function(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
var nowL=function(){return '今天 '+nowT()};
var fmtD=function(d){return (d.getMonth()+1)+'/'+d.getDate()};
var _id=0;var uid=function(){return ++_id};

/* ---------- 來福(原創 Q 版校犬) ---------- */
function dog(mood){
  var eyes=mood==='calm'
    ?'<path d="M39 63q7 6 14 0M67 63q7 6 14 0" class="stroke"/>'
    :'<circle cx="46" cy="63" r="5.5" class="ink"/><circle cx="74" cy="63" r="5.5" class="ink"/><circle cx="48" cy="61" r="1.8" fill="#fff"/><circle cx="76" cy="61" r="1.8" fill="#fff"/>';
  var brows=mood==='soft'?'<path d="M38 52l13-4M82 52l-13-4" class="stroke"/>':'';
  var mouth=mood==='happy'
    ?'<path d="M60 76v3M60 79q-6 6-11 1M60 79q6 6 11 1" class="stroke"/><path d="M55 83q5 9 10 0z" class="tongue"/>'
    :mood==='listen'
    ?'<path d="M60 76v3M60 79q-4 3-8 1M60 79q4 3 8 1" class="stroke"/>'

function detect(t){
  if(/傷害自己|不想活|想死|自殺|消失|結束生命/.test(t))return 'crisis';
  if(/沒用|沒有人在意|沒人在意|放棄|無助|討厭自己/.test(t))return 'help';
  if(/睡不著|失眠|睡不好|連續|好累|沒力氣/.test(t))return 'sleep';
  if(/考試|段考|緊張|焦慮|壓力|煩/.test(t))return 'exam';
  return 'generic';
}

function spark(a){
  var w=240,h=56,p=8,n=a.length;
  var pts=a.map(function(v,i){return [p+i*(w-2*p)/(n-1),h-p-(v-1)*(h-2*p)/4]});
  var last=pts[n-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="近 7 日心情趨勢"><path class="ln" d="'+pts.map(function(q,i){return (i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)}).join('')+'"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4"/></svg>';
}
function chart(entries){
  var W=320,H=150,L=44,R=12,T=12,B=26,n=entries.length;
  var x=function(i){return n<2?L:L+i*(W-L-R)/(n-1)};
  var y=function(v){return T+(5-v)*(H-T-B)/4};
  var g='';[[5,'很好'],[3,'普通'],[1,'低落']].forEach(function(t){g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t[0])+'" y2="'+y(t[0])+'"/><text x="'+(L-6)+'" y="'+(y(t[0])+3)+'" text-anchor="end">'+t[1]+'</text>'});
  var path=entries.map(function(e,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(e.mood).toFixed(1)}).join('');
  var dots=entries.map(function(e,i){return '<circle class="pt'+(i===n-1?' last':'')+'" cx="'+x(i).toFixed(1)+'" cy="'+y(e.mood).toFixed(1)+'" r="'+(i===n-1?5:3.5)+'"/>'}).join('');
  var lab=entries.map(function(e,i){return '<text x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+e.d+'</text>'}).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="近 7 筆心情曲線">'+g+'<path class="ln" d="'+path+'"/>'+dots+lab+'</svg>';
}

  var act=document.activeElement&&document.activeElement.id;
  var sig=S.role+'|'+S.tab+'|'+S.introStep;
  var sc=$('#screen')||document.querySelector('.screen');var top=sc&&sig===lastSig?sc.scrollTop:0;
  $('#phone').innerHTML=phoneHtml();
  $('#info').innerHTML=infoHtml();
  [].forEach.call(document.querySelectorAll('input[id],textarea[id]'),function(el){if(keep[el.id]!=null&&el.id!=='chatInput'||(el.id==='chatInput'&&keep[el.id]))el.value=keep[el.id]});
  if(act){var f=document.getElementById(act);if(f&&(f.tagName==='INPUT'||f.tagName==='TEXTAREA'))f.focus()}
  var sc2=document.querySelector('.screen');if(sc2&&!sc2.classList.contains('flush'))sc2.scrollTop=top;
  var m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;

  [].forEach.call(document.querySelectorAll('.seg button'),function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-role')===S.role))});
  var t=document.querySelector('.tools .switch');if(t)t.setAttribute('aria-checked',String(S.teacherOnline));

function toast(t){S.toast=t;var old=$('.toast');if(old)old.remove();var el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;$('#phone').appendChild(el);clearTimeout(tt);tt=setTimeout(function(){S.toast=null;var x=$('.toast');if(x)x.remove()},2200)}

/* ---------- 行為 ---------- */
function dogSay(msg){
  S.typing=true;render();
  setTimeout(function(){S.typing=false;msg.from='dog';msg.id=uid();S.chat.push(msg);S.dogMood=msg.mood||'happy';render()},700);
}
function userSay(t){S.chat.push({from:'user',id:uid(),text:t})}
function addAlert(a){a.id=uid();a.kind=a.kind||'alert';a.state=a.state||'未接觸';S.alerts.unshift(a)}
function send(text,key){
  if(S.typing||!text)return;
  userSay(text);
  var k=key||detect(text),sc=SCR[k];
  S.lastDetect={key:k,level:sc.level,signals:sc.signals,time:nowT()};
  if(k==='crisis'){
    addAlert({lv:3,code:'B-0417',time:nowL(),headline:'學生表述想傷害自己,已啟動立即危機流程',consent:'依事前說明通知(自傷表述)',dyn:true,tip:'請先確認學生現在是否安全,並依通報流程處理。'});
    S.access.push({t:nowL(),text:'輔導人員與校安機制收到危機通知(依事前說明的例外)'});
    dogSay({kind:'crisis',mood:'soft',why:'你提到想傷害自己。這件事比聊天更重要,所以我先停下來,讓真人和求助資源接手。',signals:sc.signals,
      actions:[{d:'urgent',l:'聯絡輔導老師'},{d:'stay',l:'我還在,想先待在這裡'}]});
  }else{
    var r=sc.reply;
    dogSay({mood:r.mood,html:r.html,actions:r.actions,why:r.why,signals:sc.signals});
  }
}
function chatDo(id,d){
  var m=S.chat.filter(function(x){return x.id===id})[0];if(!m||m.used||S.typing)return;
  var labels={breath:'開始呼吸練習',more:'我想繼續說',book:'預約輔導老師',yes:'願意,請老師關心我',no:'先不要',info:'老師會看到什麼?',urgent:'聯絡輔導老師',stay:'我還在,想先待在這裡'};
  m.used=true;userSay(labels[d]);
  if(d==='breath'){S.sheet={type:'breath'};render()}
  else if(d==='more'){dogSay({mood:'listen',html:'好,我在聽。你想從哪裡開始都可以,慢慢來。'})}
  else if(d==='book'){S.tab='book';S.book.urgent=false;render()}
  else if(d==='urgent'){S.tab='book';S.book.urgent=true;render()}
  else if(d==='stay'){dogSay({mood:'soft',html:'好,我在這裡,你不用一直說話。如果可以,請先打 1925,或走到身邊有大人的地方。'})}
  else if(d==='info'){dogSay({mood:'listen',html:'老師只會看到一則去識別化的提醒,不會看到你跟我說的話。你同意之後才會送出。',
    actions:[{d:'yes',l:'願意,請老師關心我'},{d:'no',l:'先不要'}]})}
  else if(d==='yes'){
    if(!S.consentL2){S.consentL2=true;
      addAlert({lv:2,code:'B-0417',time:nowL(),headline:'學生同意讓老師知道最近很辛苦',consent:'學生同意後送出的提醒',dyn:true,factors:['自我否定','近幾天心情偏低'],tip:'先讓學生決定要談多少,不要一開始就追問細節。'});
      S.access.push({t:nowL(),text:'輔導老師收到一則去識別化提醒(你同意送出)'})}
    dogSay({mood:'soft',html:'謝謝你相信我。老師只會收到「這位同學最近需要關心」的提醒,看不到你說的內容。你可以在「隱私」頁看到這次的紀錄。我還是會在這裡陪你。',
      actions:[{d:'book',l:'預約輔導老師'}]})}
  else if(d==='no'){dogSay({mood:'soft',html:'好,這是你的決定,我不會通知老師。我會繼續陪你。如果之後想讓老師知道,隨時跟我說,或自己預約也可以。',
      actions:[{d:'book',l:'自己預約輔導老師'},{d:'more',l:'繼續聊'}]})}
}
function breathStop(){clearInterval(bTimer);bTimer=null}
function breathStart(){
  breathStop();
  var c=$('#bCircle'),t=$('#bText'),s=$('#bSub'),b=$('#bBtn');if(!c)return;
  b.hidden=true;
  var round=1,phase='in',left=4;
  var apply=function(){var i=phase==='in';c.style.transitionDuration=(i?4:6)+'s';c.style.transform=i?'scale(1.3)':'scale(1)';t.textContent=(i?'慢慢吸氣 ':'慢慢吐氣 ')+left;s.textContent='第 '+round+' 輪,共 3 輪'};
  apply();
  bTimer=setInterval(function(){
    left--;
    if(left===0){
      if(phase==='in'){phase='out';left=6;apply();return}
      if(round===3){breathStop();t.textContent='做得很好';s.textContent='感覺有沒有輕鬆一點?';b.hidden=false;b.textContent='回到來福';b.setAttribute('data-act','breath-done');return}
      round++;phase='in';left=4;apply();return;
    }
    t.textContent=(phase==='in'?'慢慢吸氣 ':'慢慢吐氣 ')+left;
  },1000);
}
function closeSheet(){breathStop();S.sheet=null;render()}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),D=function(k){return el.getAttribute('data-'+k)};
  switch(a){
   case 'role-jump':case 'role':S.role=D('role');S.tab='chat';S.sheet=null;S.filter='all';render();break;
   case 'switch':S.role=null;S.sheet=null;render();break;
   case 'reset':breathStop();initState();render();break;
   case 'toggle':S[D('k')]=!S[D('k')];render();break;
   case 'intro-next':if(S.introStep<INTRO.length-1)S.introStep++;else S.introDone=true;render();break;
   case 'intro-skip':S.introDone=true;render();break;
   case 'tab':S.tab=D('t');if(D('t')!=='privacy')S.confirmDel=false;S.sheet=null;render();break;
   case 'script':send(SCR[D('k')].userText,D('k'));break;
   case 'chat-do':chatDo(+D('id'),D('d'));break;
   case 'xai':var m=S.chat.filter(function(x){return x.id===+D('id')})[0];if(m){m.xaiOpen=!m.xaiOpen;render()}break;
   case 'mic':toast('語音對話會在正式版提供,這個原型先用文字');break;
   case 'copy':try{navigator.clipboard.writeText(D('v')).then(function(){toast('已複製 '+D('v'))},function(){toast('請記下號碼 '+D('v'))})}catch(x){toast('請記下號碼 '+D('v'))}break;
   case 'mood':S.diaryMood=+D('m');render();break;
   case 'diary-save':if(S.diaryMood){S.diary.push({d:fmtD(new Date()),mood:S.diaryMood,note:S.diaryNote.trim()});S.diaryMood=null;S.diaryNote='';render();toast('已記下今天的心情')}break;
   case 'slot':S.book.slot=+D('i');render();break;
   case 'topic':var i=S.book.topics.indexOf(D('t'));if(i>-1)S.book.topics.splice(i,1);else S.book.topics.push(D('t'));render();break;
   case 'book-send':
     addAlert({lv:'B',kind:'booking',code:'B-0417',time:nowL(),headline:'學生預約面談:'+SLOTS[S.book.slot][0]+(S.book.topics.length?'(想聊:'+S.book.topics.join('、')+')':''),consent:'學生主動預約',state:'已預約',dyn:true,tip:'不需要先問原因,讓學生決定要談什麼。'});
     S.access.push({t:nowL(),text:'輔導室收到你的預約時段'+(S.book.topics.length?'和想聊的方向':'')});
     S.book.done=true;render();break;
   case 'book-reset':S.book={slot:null,topics:[],done:false,urgent:false};render();break;
   case 'del-ask':S.confirmDel=true;render();break;
   case 'del-no':S.confirmDel=false;render();break;
   case 'del-yes':S.confirmDel=false;S.chat=[{from:'dog',id:uid(),mood:'happy',html:'對話已刪除,我們可以重新開始。想說什麼都可以。'}];S.dogMood='happy';render();toast('已刪除所有對話原文');break;
   case 'filter':S.filter=D('f');render();break;
   case 'open-alert':S.sheet={type:'alert',id:+D('id')};render();break;
   case 'contacted':S.alerts.forEach(function(x){if(x.id===+D('id'))x.state='已接觸'});render();toast('已標記為已接觸');break;
   case 'close-sheet':closeSheet();break;
   case 'breath-start':breathStart();break;
   case 'breath-done':breathStop();S.sheet=null;S.dogMood='calm';S.chat.push({from:'dog',id:uid(),mood:'calm',html:'做得很好。你願意說說現在的感覺嗎?不想說也沒關係。',actions:[{d:'more',l:'我想說說'}]});render();break;
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='composer')return;e.preventDefault();
  var i=$('#chatInput'),v=i.value.trim();if(!v||S.typing)return;i.value='';send(v);
});
document.addEventListener('input',function(e){if(e.target.id==='diaryNote')S.diaryNote=e.target.value});

initState();render();
})();
</script>
